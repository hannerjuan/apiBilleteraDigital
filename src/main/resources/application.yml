server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: billpay-api
  profiles:
    active: dev
  
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25

  messages:
    basename: messages

# OpenAPI configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# JWT and Banking Security Configuration
app:
  jwt:
    # 256-bit secure secret key encoded in Base64
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  banking:
    min-transfer-amount: 1.00
    min-deposit-amount: 1.00
    max-deposit-amount: 10000.00
    min-withdraw-amount: 1.00
    max-withdraw-amount: 5000.00
    daily-withdrawal-limit: 10000.00
    initial-account-balance: 0.00

---
# Dev Profile (H2 In-Memory with PostgreSQL syntax compatibility)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:billpaydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update

---
# Prod Profile (PostgreSQL Database)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billpay_db}
    username: ${SPRING_DATASOURCE_USERNAME:billpay_user}
    password: ${SPRING_DATASOURCE_PASSWORD:billpay_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
