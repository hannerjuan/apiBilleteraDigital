services:
  postgres:
    image: postgres:16-alpine
    container_name: billpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: billpay_db
      POSTGRES_USER: billpay_user
      POSTGRES_PASSWORD: billpay_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billpay_user -d billpay_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
